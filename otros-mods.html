}

.mensaje {
    background: rgba(13,13,29,.88);
    border: 1px solid #3156a8;
    border-radius: 18px;
    padding: 30px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
}

footer {
    background: rgba(5,5,13,.9);
    border-top: 1px solid #283f7d;
    padding: 22px;
    text-align: center;
    color: #8999c2;
